name: Windows test branch

"on":
  push:
    branches:
      - Windows_Tests

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out Windows test branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze Flutter project
        shell: pwsh
        run: flutter analyze

      - name: Test Flutter project
        shell: pwsh
        run: flutter test

      - name: Test PowerShell installer
        shell: pwsh
        run: .\test\windows_installer_tests.ps1

      - name: Test release artifact helpers
        shell: pwsh
        run: .\tooling\windows\Build-WindowsRelease.ps1 -SelfTest

      - name: Build Windows packages
        shell: pwsh
        run: .\tooling\windows\Build-WindowsRelease.ps1

      - name: Verify generated checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content .\dist\SHA256SUMS.txt) {
            $expected, $name = $line -split '\s+', 2
            $assetPath = Join-Path .\dist $name
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Checksum manifest references a missing asset: $name"
            }
            $actual = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
            if ($actual -ine $expected) {
              throw "Checksum verification failed: $name"
            }
          }

      - name: Store test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SysCalculator-Windows_Tests-${{ github.sha }}
          path: |
            dist/SysCalculator-Setup.exe
            dist/SysCalculator-portable.zip
            dist/Install-LatestRelease.ps1
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
