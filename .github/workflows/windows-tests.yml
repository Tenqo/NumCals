name: NumCals Windows test build

"on":
  push:
    branches:
      - main
      - Windows_Tests
  pull_request:
    branches:
      - main
      - Windows_Tests

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numcals-windows-test:
    name: Test and package NumCals for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter project
        shell: pwsh
        run: flutter analyze

      - name: Test Flutter project
        shell: pwsh
        run: flutter test

      - name: Test PowerShell installer
        shell: pwsh
        run: .\test\windows_installer_tests.ps1

      - name: Test release artifact helpers
        shell: pwsh
        run: .\tooling\windows\Build-WindowsRelease.ps1 -SelfTest

      - name: Build Windows packages
        shell: pwsh
        run: .\tooling\windows\Build-WindowsRelease.ps1

      - name: Test standalone release installer
        shell: pwsh
        run: .\test\windows_installer_tests.ps1 -InstallerPath .\dist\Install-LatestRelease.ps1

      - name: Verify generated checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            'NumCals-Setup.exe',
            'NumCals-portable.zip',
            'Install-LatestRelease.ps1'
          )
          $manifest = Get-Content .\dist\SHA256SUMS.txt
          if ($manifest.Count -ne $assets.Count) {
            throw 'The checksum manifest contains an unexpected number of assets.'
          }
          foreach ($name in $assets) {
            $assetPath = Join-Path .\dist $name
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Checksum manifest references a missing asset: $name"
            }
            $lines = @($manifest | Where-Object { $_ -match "\s+$([regex]::Escape($name))$" })
            if ($lines.Count -ne 1) {
              throw "Checksum manifest must contain exactly one entry for $name."
            }
            $expected = ($lines[0] -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
            if ($actual -ine $expected) {
              throw "Checksum verification failed: $name"
            }
          }

      - name: Store test build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NumCals-Windows_Tests-${{ github.sha }}
          path: |
            dist/NumCals-Setup.exe
            dist/NumCals-portable.zip
            dist/Install-LatestRelease.ps1
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
