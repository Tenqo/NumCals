name: Build SysCalculator Windows release

"on":
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows packages
        shell: pwsh
        run: .\tooling\windows\Build-WindowsRelease.ps1

      - name: Upload packages to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" .\dist\SysCalculator-Setup.exe .\dist\SysCalculator-portable.zip .\dist\Install-LatestRelease.ps1 --clobber
